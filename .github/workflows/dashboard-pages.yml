name: Publish coarse-grained dashboard

on:
  push:
    branches: [research/coarse-grained-dashboard]
    paths:
      - 'dashboard/**'
      - 'scripts/serve_dashboard.js'
      - 'tests/dashboard*.js'
      - 'tests/browser-helper.js'
      - 'package.json'
      - 'bun.lock'
      - '.github/workflows/dashboard-pages.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dashboard-pages
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.13'
      - run: bun install --frozen-lockfile
      - name: Validate exported evidence and static preview
        run: bun run test
      - run: bunx playwright install --with-deps chromium
      - name: Real browser, responsiveness and accessibility
        run: bun run test:browser
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dashboard-browser-checks
          path: test-results/dashboard
  deploy:
    needs: validate
    # Owner must enable Pages and explicitly opt in; do not replace an existing site.
    if: vars.ENABLE_DASHBOARD_PAGES == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dashboard
      - name: Deploy read-only dashboard
        id: deployment
        uses: actions/deploy-pages@v4
