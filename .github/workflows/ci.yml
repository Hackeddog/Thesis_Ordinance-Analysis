name: Pipeline correctness
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v2
      - name: CPU-only PyTorch (avoid unused CUDA packages on hosted runners)
        run: python -m pip install torch==2.8.0 --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install -r requirements-models.txt
      - name: Modeling contracts and synthetic integration (not thesis results)
        run: python -m pytest tests/test_models.py tests/test_evidence.py -q
      - name: Existing extraction and curation regression suite
        run: python tests/test_pipeline.py
      - name: Presentation generator syntax
        run: python -m py_compile scripts/build_presentation.py scripts/run_comparison.py
