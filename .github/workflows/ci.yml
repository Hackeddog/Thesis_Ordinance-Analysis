name: Clean-text pipeline correctness
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      MPLBACKEND: Agg
      TOKENIZERS_PARALLELISM: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v2
      - name: CPU-only PyTorch
        run: python -m pip install torch==2.8.0 --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install -r requirements-models.txt
      - name: Offline preparation, encoder and modeling contracts
        run: python -m pytest tests/test_clean_text.py tests/test_clean_evidence.py tests/test_temporal_graphs.py -q
      - name: Presentation generator syntax
        run: python -m py_compile scripts/build_clean_presentation.py scripts/presentation_style.py scripts/build_temporal_graphs.py
