name: Exploratory two-model pilot (manual)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  experiment:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      MPLBACKEND: Agg
      TOKENIZERS_PARALLELISM: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v2
      - name: CPU-only PyTorch
        run: python -m pip install torch==2.8.0 --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install -r requirements-models.txt
      - name: Run both models and parameter-sensitivity trials
        run: python scripts/run_comparison.py --config configs/pilot.json
      - name: Generate measured charts and editable presentation
        run: python scripts/build_presentation.py --experiment results/experiments/pilot --output artifacts/ci-pilot
      - name: Preserve reproducibility metadata, logs and deliverables
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: exploratory-pilot-${{ github.run_id }}
          path: |
            artifacts/ci-pilot/
            results/experiments/pilot/experiment.json
            results/experiments/pilot/corpus_audit.csv
            results/experiments/pilot/tuning_results.csv
            results/experiments/pilot/*.log
            results/experiments/pilot/*/run_config.json
            results/experiments/pilot/*/*/metrics.json
            results/experiments/pilot/*/*/model_metadata.json
          retention-days: 14
